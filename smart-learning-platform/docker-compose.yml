version: "3.8"

services:
  # ===================== 应用 =====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-learning-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8081
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=smart_learning
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-smartlearning123}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redispass123}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin123}
      - MINIO_BUCKET=smart-learning
      - JWT_SECRET=${JWT_SECRET:-ChangeMeToARandom64CharString!}
      - JWT_EXPIRATION=86400000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - LOG_LEVEL=INFO
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC
      - TESSDATA_PATH=/app/tessdata
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - smart-learning-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  # ===================== MySQL =====================
  mysql:
    image: mysql:8.0
    container_name: smart-learning-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_EXPOSE_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-smartlearning123}
      MYSQL_DATABASE: smart_learning
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --ngram_token_size=2
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - smart-learning-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-smartlearning123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===================== Redis =====================
  redis:
    image: redis:7-alpine
    container_name: smart-learning-redis
    restart: unless-stopped
    ports:
      - "${REDIS_EXPOSE_PORT:-6379}:6379"
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD:-redispass123}
      - --maxmemory 256mb
      - --maxmemory-policy allkeys-lru
      - --appendonly yes
      - --save 900 1
      - --save 300 10
    volumes:
      - redis-data:/data
    networks:
      - smart-learning-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================== MinIO =====================
  minio:
    image: minio/minio:latest
    container_name: smart-learning-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - smart-learning-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  smart-learning-net:
    driver: bridge
