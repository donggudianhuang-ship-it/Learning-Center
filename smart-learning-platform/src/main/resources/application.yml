spring:
  application:
    name: smart-learning-platform

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_learning?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456

  data:
    redis:
      host: localhost
      port: 6379
      password: 2819516357
      database: 0
      timeout: 10000ms

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  web:
    resources:
      add-mappings: true
  mvc:
    throw-exception-if-no-handler-found: false

server:
  port: 8081

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.example.smartlearning.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT Configuration
jwt:
  secret: SmartLearningPlatformSecretKey2024VeryLongSecretKeyForJWT
  expiration: 86400000

# DeepSeek API Configuration
claude:
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  max-tokens: 4096
  # DeepSeek API 地址
  api-url: https://api.deepseek.com/v1/chat/completions
  # 视觉模型（用于图片识别）
  vision-model: deepseek-chat

# MinIO Configuration
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: smart-learning

# OCR Configuration
ocr:
  tessdata-path: ./tessdata
  language: chi_sim+eng

logging:
  level:
    org.example.smartlearning: DEBUG
    org.springframework.security: INFO
